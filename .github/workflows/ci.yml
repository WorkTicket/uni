# NOTE: written but NOT executed in the authoring environment (no GitHub runner available there).
name: ci
on: [push, pull_request]
jobs:
  fast:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest], python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[dev]" -c constraints.txt
      - run: python -m pytest -q
      - run: python -m universe_engine.cli doctor
